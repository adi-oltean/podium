\* SR-NA01: no abort — AbortTime = 301 > Horizon = 300, so the abort
\* guard is never enabled (matches arch_srna01.json, abort_time = -1).
SPECIFICATION Spec
CONSTANT AbortTime = 301
CONSTANT Horizon = 300
CONSTANT BoxLatched = TRUE
INVARIANT TypeOK
INVARIANT AttemptRequiresBox
PROPERTY Monotone
PROPERTY Absorbing
PROPERTY AbortDominates
PROPERTY EntryFromBox
PROPERTY EntryBeforeAbort
