\* Discretization: one offset unit ~ 1 dm (GateTol = 1 ~ the 0.06 m gate
\* threshold, rounded up); one tick ~ t_phase_a / PhaseATicks of mission
\* time; replan times land at ticks 0, 2, 4 (thirds of phase A, as in
\* mission.py).  Tol = GateTol + B: the exact boundary at which
\* CorridorHoldSound is provable (see the module comment). B is required
\* at BC near-gate decisions; estimates remain adversarial elsewhere.
