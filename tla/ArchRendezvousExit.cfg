\* Box-exit robustness experiment (docs/add-tla-specs.md WP1 modeling
\* notes): entry is NOT latched — the environment may revoke it while
\* the mode is still approaching.  Checked under SpecSF (strong fairness
\* on EnterAttempt): sustained box presence still converts to mode
\* entry.  Under plain Spec (weak fairness) EntrySustainedBox is
\* falsified by the enter/exit flicker, and plain EntryFromBox is
\* falsified under any fairness by one revoked entry — both receipts in
\* the module comment and Section 10.  No-abort constants, as in SRNA.
SPECIFICATION SpecSF
CONSTANT AbortTime = 301
CONSTANT Horizon = 300
CONSTANT BoxLatched = FALSE
INVARIANT TypeOK
INVARIANT AttemptRequiresBox
PROPERTY Monotone
PROPERTY Absorbing
PROPERTY AbortDominates
PROPERTY EntrySustainedBox
